<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập — Dailyc Coffee</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; background: var(--color-bg); }
    .login-card { width: 360px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-flat); padding: var(--space-8); }
    .login-card h1 { text-align:center; font-size: var(--font-size-h1); margin-bottom: var(--space-2); }
    .login-card p.sub { text-align:center; color: var(--color-text-muted); font-size: var(--font-size-small); margin-bottom: var(--space-6); }
    .login-error { color: var(--color-danger); font-size: var(--font-size-small); margin-bottom: var(--space-3); min-height: 18px; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <h1>☕ Dailyc Coffee</h1>
    <p class="sub">Đăng nhập để quản lý kinh doanh</p>
    <div class="login-error" id="login-error"></div>
    <div class="field"><label>Email</label><input id="email" type="email" required autofocus /></div>
    <div class="field"><label>Mật khẩu</label><input id="password" type="password" required /></div>
    <button class="btn btn-primary" style="width:100%;" type="submit" id="submit-btn">Đăng nhập</button>
  </form>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';
      btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
      try {
        await Api.post('/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        location.href = '/index.html';
      } catch (err) {
        errEl.textContent = err.message || 'Đăng nhập thất bại.';
        btn.disabled = false; btn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
